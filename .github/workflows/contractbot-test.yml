name: Contractbot Validation Test

on:
  pull_request:
    branches:
      - main

jobs:
  contractbot:
    name: Contractbot Validation Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Prepare Backend Verification Runtime
        run: |
          cd backend
          uv venv
          uv pip install -r requirements.txt -r openapi-requirements.txt pytest pytest-asyncio

      - name: Run Contractbot Action
        uses: optimusbuilder/contractbot@v0
        with:
          config: .contractbot.yml
          fail-on: breaking
